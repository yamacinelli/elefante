enableScripts: false           # equivalent to ignore-scripts=true
                               # blocks lifecycle scripts (postinstall etc.) from third-party packages

npmMinimalAgeGate: "7d"        # equivalent to min-release-age=7

enableHardenedMode: true       # validates that yarn.lock entries actually match what's published on the registry (catches lockfile tampering)

enableImmutableInstalls: true  # like npm's --frozen-lockfile / npm ci — blocks local installs from silently rewriting yarn.lock
